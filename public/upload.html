<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SehatQure - Upload</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Page Transition base */
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        /* ===== TOP SECTION ===== */
        .top-section {
            background: #6EC1E4;
            padding: 30px 0 80px 0;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 100px;
            font-size: 22px;
            margin-bottom: 40px;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-weight: 500;
        }

        nav a.active {
            font-weight: 600;
        }

        /* IMAGE STRIP */
        .banner-img {
            width: 70%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        .line {
            width: 40%;
            height: 6px;
            background: black;
            margin: 20px auto 0 auto;
        }

        /* ===== BOTTOM SECTION ===== */
        .bottom-section {
            background: #e9e9e9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 80px 120px;
            flex-wrap: wrap;
        }

        .upload-text {
            max-width: 500px;
        }

        .upload-text h1 {
            font-size: 50px;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .upload-text p {
            font-size: 22px;
            color: #6bbbc7;
            margin-bottom: 30px;
        }

        /* Upload Box */
        .upload-box {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            width: 380px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .upload-box:hover {
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }

        .upload-box input[type="file"] {
            margin: 25px 0;
            width: 100%;
            padding: 10px;
            border: 2px dashed #6EC1E4;
            border-radius: 8px;
            background: #f9f9f9;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-box input[type="file"]:hover {
            background: #f0f8ff;
            border-color: #5aa8c5;
        }

        .upload-box button {
            width: 100%;
            padding: 14px 20px;
            background: #6EC1E4;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .upload-box button:hover {
            background: #5aa8c5;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .upload-box button:active {
            transform: translateY(0);
        }

        .skip-btn {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #666;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .skip-btn:hover {
            color: #0A3D62;
            text-decoration: underline;
        }

        /* RIGHT SIDE LOGO */
        .logo-section {
            text-align: center;
        }

        .logo-img {
            width: 220px;
        }

        .brand {
            font-size: 45px;
            font-weight: 600;
            color: #0a3d62;
            margin-top: 15px;
        }

        .ecg {
            width: 220px;
            height: 4px;
            background: #0a3d62;
            margin: 10px auto 0 auto;
        }
    </style>
</head>

<body>

    <!-- TOP SECTION -->
    <div class="top-section" style="position: relative;">
        <button onclick="goBack()"
            style="position: absolute; left: 25px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 18px; border-radius: 20px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">&#8592;
            Back</button>
        <nav>
            <a href="/index.html">Home</a>
            <a href="#" class="active">Upload</a>
            <a href="#">Contact</a>
        </nav>

        <img src="/photo.png" class="banner-img" alt="Hospital">

        <div class="line"></div>

    </div>

    <!-- BOTTOM SECTION -->
    <div class="bottom-section">

        <div class="upload-text">
            <h1>Upload Reports:</h1>
            <p>Add file / Upload the reports here</p>

            <div class="upload-box">
                <form id="uploadForm">
                    <input type="file" id="reportFile" name="reports" accept="application/pdf" required>
                    <br>
                    <button type="submit">Upload</button>
                    <a href="#" class="skip-btn" id="skipBtn">Skip for Now</a>
                </form>
            </div>
        </div>

        <div class="logo-section">
            <img src="/logo.png" class="logo-img" alt="SehatQure Logo">
            <div class="brand">SehatQure</div>
            <div class="ecg"></div>
        </div>

    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fileInput = document.getElementById('reportFile');
            if (!fileInput.files.length) {
                alert("Please select a file to upload.");
                return;
            }

            const formData = new FormData();
            formData.append('reports', fileInput.files[0]);

            try {
                const response = await fetch('/upload-reports', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message);
                    transitionToPage('/dashboard.html');
                } else {
                    alert(data.message || "Failed to upload document");
                }
            } catch (err) {
                console.error(err);
                alert("Error connecting to server");
            }
        });

        // Skip logic
        document.getElementById('skipBtn').addEventListener('click', (e) => {
            e.preventDefault();
            transitionToPage('/dashboard.html');
        });

        // Page transition functionality
        document.body.style.opacity = '1';

        function transitionToPage(url) {
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = url;
            }, 300);
        }

        // Intercept navigation links
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', (e) => {
                const href = link.getAttribute('href');
                if (href && href !== '#' && !href.startsWith('javascript:')) {
                    e.preventDefault();
                    transitionToPage(href);
                }
            });
        });

        window.addEventListener('pageshow', function (e) {
            if (e.persisted) document.body.style.opacity = '1';
        });

        function goBack() {
            document.body.style.opacity = '0';
            setTimeout(() => {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = '/index.html';
                }
            }, 300);
        }
    </script>

</body>

</html>
