<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SehatQure - OTP Verification</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #e9e9e9;

            /* Page Transition base */
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        /* HEADER */
        .header {
            background: #6EC1E4;
            padding: 20px;
            text-align: center;
            color: white;
        }

        .logo {
            width: 60px;
            vertical-align: middle;
        }

        .brand {
            font-size: 28px;
            font-weight: 600;
            display: inline-block;
            margin-left: 10px;
            vertical-align: middle;
        }

        /* MAIN */
        .main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 85vh;
        }

        .box {
            background: white;
            padding: 50px;
            width: 400px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 20px;
        }

        /* INPUT */
        input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #6EC1E4;
            outline: none;
            box-shadow: 0 0 8px rgba(110, 193, 228, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #6EC1E4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background: #5aa8c5;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        button:active {
            transform: translateY(0);
        }

        /* OTP SECTION */
        .otp-section {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .otp-inputs {
            display: flex;
            justify-content: center;
            margin: 25px 0;
            gap: 10px;
        }

        .otp-inputs input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            padding: 0;
            border-radius: 8px;
        }

        .timer {
            font-size: 15px;
            margin-bottom: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <div class="brand-container" style="display: inline-block;">
            <img src="/logo.png" class="logo">
            <span class="brand">SehatQure</span>
        </div>
    </div>

    <!-- ABSOLUTE BACK BUTTON -->
    <button onclick="goBack()"
        style="position: absolute; top: 20px; left: 20px; background: white; border: 2px solid #e1e1e1; color: #555; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; z-index: 100;">&#8592;</button>

    <div class="main">

        <div class="box">

            <!-- PHONE SECTION -->
            <div id="phoneSection">
                <h2>Login with Phone</h2>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>
                <button onclick="sendOTP()">Send OTP</button>
            </div>

            <!-- OTP SECTION -->
            <div id="otpSection" class="otp-section">
                <h2>Enter OTP</h2>
                <p>OTP sent to <span id="displayPhone"></span></p>

                <div class="otp-inputs">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                </div>

                <div class="timer">
                    Expires in <span id="countdown">60</span> sec
                </div>

                <button onclick="verifyOTP()">Verify OTP</button>
            </div>

        </div>

    </div>

    <script>
        let generatedOTP = "";

        /* Send OTP via API */
        async function sendOTP() {
            const phone = document.getElementById("phone").value;

            if (phone.length < 10) {
                alert("Enter valid phone number");
                return;
            }

            try {
                const response = await fetch('/patient-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });

                const data = await response.json();

                if (response.ok) {
                    // Generate random 6 digit OTP to simulate API returning/sending one
                    generatedOTP = Math.floor(100000 + Math.random() * 900000);
                    alert("API Response: " + data.message + "\nDemo OTP: " + generatedOTP);

                    document.getElementById("phoneSection").style.display = "none";
                    document.getElementById("otpSection").style.display = "block";
                    document.getElementById("displayPhone").innerText = phone;

                    startTimer();
                } else {
                    alert(data.message || "Failed to send OTP");
                }
            } catch (err) {
                console.error(err);
                alert("Error connecting to server");
            }
        }

        /* Timer */
        function startTimer() {
            let time = 60;
            const countdown = document.getElementById("countdown");

            const timer = setInterval(() => {
                time--;
                countdown.textContent = time;
                if (time <= 0) {
                    clearInterval(timer);
                    alert("OTP Expired");
                }
            }, 1000);
        }

        /* Verify OTP */
        function verifyOTP() {
            let enteredOTP = "";
            document.querySelectorAll(".otp-inputs input").forEach(input => {
                enteredOTP += input.value;
            });

            if (enteredOTP == generatedOTP) {
                // Remove alert to make the transition smoother
                // Redirect to new patient details page
                transitionToPage('/patient-details.html');
            } else {
                alert("Invalid OTP");
            }
        }

        /* Auto move to next box */
        const inputs = document.querySelectorAll(".otp-inputs input");
        inputs.forEach((input, index) => {
            input.addEventListener("input", () => {
                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
        });

        // Page transition functionality
        document.body.style.opacity = '1';

        function transitionToPage(url) {
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = url;
            }, 300);
        }

        window.addEventListener('pageshow', function (e) {
            if (e.persisted) document.body.style.opacity = '1';
        });

        function goBack() {
            document.body.style.opacity = '0';
            setTimeout(() => {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = '/index.html';
                }
            }, 300);
        }
    </script>

</body>

</html>
